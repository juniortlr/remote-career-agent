[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-career-agent"
version = "0.1.0"
description = "Local-first remote job discovery and evidence-backed application preparation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
career-agent = "career_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
